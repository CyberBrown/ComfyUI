services:
  comfyui:
    image: comfyui-audio:2026-01-15
    container_name: comfyui-optimized
    runtime: nvidia
    ports:
      - "8188:8188"
    volumes:
      - .:/workspace/ComfyUI
    working_dir: /workspace/ComfyUI
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=http://host.docker.internal:11434
    command: bash -c "
      pip install --break-system-packages --no-cache-dir
        ftfy
        imageio-ffmpeg
        onnxruntime
        pedalboard
        modelscope
      &&
      python main.py --listen 0.0.0.0 --port 8188 --highvram --use-flash-attention --fp16-unet --fast
      "
    restart: unless-stopped
